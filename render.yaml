services:
  - type: web
    name: render-engine
    env: docker
    plan: free
    region: singapore # or singapore / frankfurt
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 10000
      - key: SSH_PASS
        generateValue: true
      - key: TTYD_USER
        value: admin
      - key: TTYD_PASS
        generateValue: true
      - key: SSH_PUBKEY
        value: "" # Optional: Paste your ~/.ssh/id_ed25519.pub content here
      - key: ENABLE_EASYTIER
        value: "" # Optional: Set to true or define ET_NAME to enable EasyTier
      - key: ET_NAME
        value: "" # Optional: e.g. "my-mesh"
      - key: ET_SECRET
        generateValue: true # Set manually if joining an existing mesh; leave generateValue for new isolated mesh
      - key: ET_PEERS
        value: "" # Optional: e.g. "tcp://your-vps.com:11010"
      - key: ENABLE_SINGBOX
        value: "" # Optional: Set to true or define SINGBOX_UUID to enable sing-box
      - key: SINGBOX_UUID
        value: "" # Optional: UUID for sing-box VLESS inbound
      - key: KOMARI_TOKEN
        value: "" # Optional: Node token for MangoHub telemetry
      - key: KOMARI_ENDPOINT
        value: "" # Optional: e.g. "https://your-dashboard.com"
      - key: ENABLE_KEEPALIVE
        value: "true" # Keepalive daemon prevents Render 15-min inactivity hibernation
      - key: KEEPALIVE_INTERVAL
        value: "300" # Inbound ping interval in seconds (default 300s = 5m)
